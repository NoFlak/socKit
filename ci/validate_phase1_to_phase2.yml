name: Validate Phase 1 to Phase 2

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repository checklist
        run: bash scripts/validate_repo.sh

      - name: Pytest
        run: pytest

      - name: Menu generator dry run
        run: python tools/generate_menus.py --dry-run

      - name: Placeholder token audit
        run: python tools/validate_tools.py --check-placeholders
