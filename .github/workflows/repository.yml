name: Repository Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Root Python and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Validate repository contracts
        run: bash scripts/validate_repo.sh

      - name: Verify generated menus are current
        run: python tools/generate_menus.py --dry-run

      - name: Run root test suite
        run: python -m pytest
